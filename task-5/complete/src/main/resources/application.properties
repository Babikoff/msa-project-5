spring.datasource.url=jdbc:postgresql://postgresdb:5432/productsdb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.batch.jdbc.initialize-schema=always
spring.jpa.hibernate.ddl-auto=create-drop
spring.batch.jdbc.table-prefix=BATCH_

management.endpoints.web.exposure.include=health,info,prometheus,batch
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=batch-processing

otel.service.name=batch-processing
otel.exporter.otlp.endpoint=http://jaeger:4317
otel.exporter.otlp.protocol=http/protobuf
otel.traces.sampler=always_on

spring.batch.job.enabled=true