route:
  receiver: 'email-admin'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'email-admin'
    email_configs:
      - to: 'ops@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'mailhog:1025'
        require_tls: false
        auth_username: ''
        auth_password: ''