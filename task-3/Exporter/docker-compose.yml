services:
  exporterjob:
    image: ${DOCKER_REGISTRY-}exporterjob
    build:
      context: .
      dockerfile: ExporterJob/Dockerfile
    networks:
      - export-net
    depends_on:
      postgres-delivery:
        condition: service_healthy

  postgres-delivery:
    image: postgres:17-alpine
    container_name: postgres-delivery
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_POSTGRESPASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_USER} && psql -U $${POSTGRES_USER} -d $${POSTGRES_USER} -tAc \"SELECT 1 FROM information_schema.tables WHERE table_name='clients'\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres-delivery:/var/lib/postgresql/data
      - ../postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - export-net

volumes:
  postgres-delivery:

networks:
  export-net:
