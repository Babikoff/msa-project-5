apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-delivery
  namespace: exporter
  labels:
    app: postgres-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-delivery
  template:
    metadata:
      labels:
        app: postgres-delivery
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-delivery
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-delivery
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$$POSTGRES_USER", "-d", "$$POSTGRES_USER"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$$POSTGRES_USER", "-d", "$$POSTGRES_USER"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-delivery
        - name: postgres-init
          configMap:
            name: postgres-init